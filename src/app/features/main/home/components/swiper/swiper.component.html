<swiper-container #swiper class="mySwiper" init="false">
  @for (slide of slides(); track slide) {
    <swiper-slide>
      <div class="relative w-full h-100">
        <div
          [style.background-image]="
            'linear-gradient(to right, rgba(34, 197, 94, 0.7), rgba(34, 197, 94, 0.3)), url(' +
            slide.image +
            ')'
          "
          class="bg-center bg-no-repeat bg-cover absolute w-full h-full text-white bg-linear-to-r"
        >
          <div class="container h-full content-center">
            <h2
              class="text-white text-3xl font-bold mb-4 max-w-96 mx-auto"
              style="opacity: 1; transform: none"
            >
              {{ slide.title | translate }}
            </h2>
            <p style="opacity: 1; transform: none">{{ slide.content | translate }}</p>
            <div class="mt-4" style="opacity: 1; transform: none">
              <a
                class="cursor-pointer bg-white border-2 border-white/50 text-green-500 inline-block px-6 py-2 rounded-lg font-semibold hover:scale-105 transition-transform"
                routerLink="/shop"
              >
                {{ slide.buttonTextOne | translate }}
              </a>
              <a
                class="cursor-pointer bg-transparent border-2 border-white/50 text-white ml-2 inline-block px-6 py-2 rounded-lg font-semibold hover:scale-105 transition-transform"
                routerLink=""
              >
                {{ slide.buttonTextTwo | translate }}
              </a>
            </div>
          </div>
        </div>
      </div>
    </swiper-slide>
  }
</swiper-container>
