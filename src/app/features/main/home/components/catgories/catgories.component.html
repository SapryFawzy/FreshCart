<section class="container px-4 pt-10 pb-20">
  <div class="flex justify-between items-center mb-8">
    <h2 class="catgory-title-side-line font-bold text-2xl relative">
      {{ 'UI.SHOP_BY' | translate }}
      <span class="text-[#009966]">{{ 'UI.CATEGORY' | translate }}</span>
    </h2>
    <button type="button" class="flex items-center gap-2 cursor-pointer">
      <span class="font-medium text-[#16A34A]">{{ 'UI.VIEW_ALL_CATEGORIES' | translate }}</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="12"
        viewBox="0 0 16 12"
        fill="none"
      >
        <path
          d="M15.7063 6.70859C16.0969 6.31797 16.0969 5.68359 15.7063 5.29297L10.7063 0.292969C10.3156 -0.0976562 9.68125 -0.0976562 9.29062 0.292969C8.9 0.683594 8.9 1.31797 9.29062 1.70859L12.5844 5.00234H1C0.446875 5.00234 0 5.44922 0 6.00234C0 6.55547 0.446875 7.00234 1 7.00234H12.5844L9.29062 10.2961C8.9 10.6867 8.9 11.3211 9.29062 11.7117C9.68125 12.1023 10.3156 12.1023 10.7063 11.7117L15.7063 6.71172V6.70859Z"
          fill="#16A34A"
        />
      </svg>
    </button>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6">
    @for (category of categories(); track category._id) {
      <div
        [routerLink]="['/categories', category._id]"
        class="flex flex-col items-center justify-center gap-2 cursor-pointer"
      >
        <div class="w-25 h-25 rounded-full bg-[#F5F5F5] flex items-center justify-center">
          <img
            [src]="category.image"
            [alt]="category.name"
            class="w-15 h-15 rounded-full object-cover"
          />
        </div>
        <span class="text-sm font-medium text-[#333333]">{{ category.name }}</span>
      </div>
    }
  </div>
</section>
