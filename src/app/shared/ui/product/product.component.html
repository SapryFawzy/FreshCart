@if (done()) {
  <section class="container px-4 pt-10 pb-20">
    <div class="flex mb-8">
      <h2 class="catgory-title-side-line font-bold text-2xl relative">
        {{ 'UI.FEATURED' | translate }} <span class="text-[#009966]">{{ 'UI.PRODUCTS' | translate }}</span>
      </h2>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 xl:grid-cols-5 gap-4">
      @for (product of products(); track product._id) {
        <app-product-card [product]="product"></app-product-card>
      }
    </div>
  </section>
} @else {
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
    @for (item of [1, 2, 3, 4, 5, 6, 7, 8]; track item) {
      <div class="overflow-hidden rounded-lg border border-gray-100 bg-white">
        <!-- Product Image -->
        <div class="aspect-square bg-gray-200 animate-pulse"></div>

        <!-- Product Information -->
        <div class="space-y-3 p-3">
          <!-- Product Title -->
          <div class="h-4 w-full rounded bg-gray-200 animate-pulse"></div>
          <div class="h-4 w-2/3 rounded bg-gray-200 animate-pulse"></div>

          <!-- Rating / Category -->
          <div class="h-3 w-1/3 rounded bg-gray-200 animate-pulse"></div>

          <!-- Price -->
          <div class="h-5 w-1/2 rounded bg-gray-200 animate-pulse"></div>
        </div>
      </div>
    }
  </div>
}
